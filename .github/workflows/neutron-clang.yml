name: Miatoll Neutron Clang

on:
  workflow_dispatch:
  push:
    branches: [16]

permissions:
  contents: read

concurrency:
  group: neutron-clang-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  MAKE_TOOLS: >-
    CC=clang LD=ld.lld AS=clang AR=llvm-ar NM=llvm-nm STRIP=llvm-strip
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf
    HOSTCC=clang HOSTCXX=clang++ HOSTLD=ld.lld LLVM_IAS=1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: true
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
  CCACHE_COMPRESS: true
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Checkout kernel
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev python3 \
            cpio lz4 zstd rsync unzip zip curl ccache

      - name: Fetch latest Neutron Clang
        id: neutron
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Neutron-Toolchains/clang-build-catalogue/main
          tag=$(curl -fsSL "$base/latest.txt" | awk '/^\[tag\]/{getline; gsub(/[[:space:]]/,""); print; exit}')
          test -n "$tag"
          sha=$(curl -fsSL "$base/${tag}-info.txt" | awk '/^\[shasum\]/{getline; gsub(/[[:space:]]/,""); print; exit}')
          test -n "$sha"
          url="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${tag}/neutron-clang-${tag}.tar.zst"
          echo "Neutron Clang tag: $tag"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/neutron-clang.tar.zst" "$url"
          echo "${sha}  $RUNNER_TEMP/neutron-clang.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/neutron"
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/neutron-clang.tar.zst" -C "$RUNNER_TEMP/neutron"
          echo "$RUNNER_TEMP/neutron/bin" >> "$GITHUB_PATH"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/neutron/bin/clang" --version
          "$RUNNER_TEMP/neutron/bin/ld.lld" --version
          # ccache masquerade: clang/clang++ resolve to ccache, which finds the
          # real compiler via CCACHE_PATH. Keeps make variables plain.
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/clang"
          ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/clang++"
          echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_PATH=$RUNNER_TEMP/neutron/bin" >> "$GITHUB_ENV"
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-neutron-${{ steps.neutron.outputs.tag }}-${{ github.run_id }}
          restore-keys: |
            ccache-neutron-${{ steps.neutron.outputs.tag }}-

      - name: Configure
        run: |
          set -euo pipefail
          make -j"$(nproc)" O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            $MAKE_TOOLS "$DEFCONFIG"
          # This 4.14 LTO path only supports GNU gold; a pure-LLVM lld build is non-LTO.
          scripts/config --file out/.config -d LTO_CLANG -d THINLTO
          make -j"$(nproc)" O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            $MAKE_TOOLS olddefconfig
          grep -E '^CONFIG_(LTO_CLANG|THINLTO|CC_IS_CLANG)=' out/.config || true

      - name: Build kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            $MAKE_TOOLS \
            Image.gz
          test -s out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz
          ccache --show-stats

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/.github
          cp out/arch/arm64/boot/Image.gz anykernel/Image.gz
          cat > anykernel/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Miatoll Neutron Clang
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=curtana
          device.name2=joyeuse
          device.name3=excalibur
          device.name4=gram
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          ### AnyKernel install
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          printf 'kernel=Miatoll Neutron Clang\nclang=%s\ncommit=%s\n' \
            "${{ steps.neutron.outputs.tag }}" "${GITHUB_SHA}" > anykernel/build-info.txt
          (cd anykernel && zip -r9 "$GITHUB_WORKSPACE/Miatoll-Neutron-${{ steps.neutron.outputs.tag }}-${GITHUB_SHA::12}.zip" .)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Miatoll-Neutron-${{ steps.neutron.outputs.tag }}-${{ github.sha }}
          path: |
            Miatoll-Neutron-*.zip
            out/arch/arm64/boot/Image.gz
            out/.config
          if-no-files-found: error
          retention-days: 14
