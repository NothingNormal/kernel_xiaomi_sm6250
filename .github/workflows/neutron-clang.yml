name: SixFaced Kernel

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Clean build (disable ccache)"
        required: false
        type: boolean
        default: false
      ksu_ref:
        description: "BakaSU branch, tag or commit"
        required: false
        type: string
        default: "d5e9e025"
  push:
    branches: [16]

permissions:
  contents: read

concurrency:
  group: sixfaced-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  MAKE_TOOLS: >-
    CC=clang LD=ld.lld AS=clang AR=llvm-ar NM=llvm-nm STRIP=llvm-strip
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf
    HOSTCC=clang HOSTCXX=clang++ HOSTLD=ld.lld LLVM_IAS=1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: true
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 1
  CCACHE_MAXSIZE: 5G
  KBUILD_BUILD_USER: NothingNormal
  KBUILD_BUILD_HOST: github

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set build version and names
        run: |
          name=$(sed -n 's/^CONFIG_LOCALVERSION="-\(.*\)"/\1/p' "arch/arm64/configs/${DEFCONFIG}")
          if [ -z "$name" ]; then name="SixFaced"; fi
          date_tag=$(date -u +%Y%m%d-%H%M)
          echo "KERNEL_NAME=${name}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${name}-${date_tag}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends libelf-dev ccache

      - name: Fetch latest Neutron Clang tag
        id: neutron
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Neutron-Toolchains/clang-build-catalogue/main
          tag=$(curl -fsSL "$base/latest.txt" | awk '/^\[tag\]/{getline; gsub(/[[:space:]]/,""); print; exit}')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Neutron Clang tag: $tag"

      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/neutron
          key: neutron-clang-${{ steps.neutron.outputs.tag }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Neutron-Toolchains/clang-build-catalogue/main
          tag="${{ steps.neutron.outputs.tag }}"
          sha=$(curl -fsSL "$base/${tag}-info.txt" | awk '/^\[shasum\]/{getline; gsub(/[[:space:]]/,""); print; exit}')
          test -n "$sha"
          url="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${tag}/neutron-clang-${tag}.tar.zst"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/neutron-clang.tar.zst" "$url"
          echo "${sha}  $RUNNER_TEMP/neutron-clang.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/neutron"
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/neutron-clang.tar.zst" -C "$RUNNER_TEMP/neutron"
          rm -f "$RUNNER_TEMP/neutron-clang.tar.zst"

      - name: Setup toolchain environment
        run: |
          echo "$RUNNER_TEMP/neutron/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/clang"
          ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/clang++"
          echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_PATH=$RUNNER_TEMP/neutron/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/neutron/bin/clang" --version
          "$RUNNER_TEMP/neutron/bin/ld.lld" --version

      - name: Restore ccache
        if: ${{ !inputs.clean }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-neutron-${{ steps.neutron.outputs.tag }}-${{ github.sha }}
          restore-keys: |
            ccache-neutron-${{ steps.neutron.outputs.tag }}-
            ccache-neutron-

      - name: Set up BakaSU
        run: |
          ref="${{ inputs.ksu_ref || 'd5e9e025' }}"
          git clone --filter=blob:none https://github.com/Baka-SU/BakaSU KernelSU
          git -C KernelSU checkout -q "$ref"
          echo "BakaSU: $(git -C KernelSU log -1 --format='%h %s') ($(git -C KernelSU rev-list --count HEAD) commits)"

      - name: Configure
        run: |
          set -euo pipefail
          make -j$(( $(nproc --all) + 1 )) O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            $MAKE_TOOLS "$DEFCONFIG"
          # 4.14 LTO path only supports GNU gold; a pure-LLVM lld build is non-LTO
          scripts/config --file out/.config -d LTO_CLANG -d THINLTO
          make -j$(( $(nproc --all) + 1 )) O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            $MAKE_TOOLS olddefconfig
          make -j$(( $(nproc --all) + 1 )) O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            $MAKE_TOOLS headers_install INSTALL_HDR_PATH="$(pwd)/out/usr"
          grep -E '^CONFIG_(LTO_CLANG|THINLTO|CC_IS_CLANG|LLVM_POLLY|INLINE_OPTIMIZATION)=' out/.config || true

      - name: Build kernel
        run: |
          set -euo pipefail
          if [ "${{ inputs.clean }}" = "true" ]; then export CCACHE_DISABLE=1; fi
          ccache -z
          make -j$(( $(nproc --all) + 1 )) O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            $MAKE_TOOLS \
            Image.gz 2>&1 | tee build.log
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            grep -E 'error:|Error [0-9]|undefined reference|undefined symbol|ld.lld:' build.log | grep -v '^make\[' | sort -u | head -40 |
              while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit "$rc"
          fi
          test -s out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz
          ccache -s -v

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/.github anykernel/README.md

          # Adapt the official AnyKernel3 template; never shadow its uppercase API variables.
          test "$(grep -c '^. tools/ak3-core.sh;$' anykernel/anykernel.sh)" -eq 1
          sed -n '1,/^\. tools\/ak3-core.sh;$/p' anykernel/anykernel.sh > "$RUNNER_TEMP/anykernel.sh"
          grep -qxF '. tools/ak3-core.sh;' "$RUNNER_TEMP/anykernel.sh"
          for setting in kernel.string device.name1 device.name2 device.name3 device.name4 device.name5 BLOCK IS_SLOT_DEVICE RAMDISK_COMPRESSION PATCH_VBMETA_FLAG; do
            test "$(grep -c "^$setting=" "$RUNNER_TEMP/anykernel.sh")" -eq 1
          done
          sed -i \
            -e 's/^kernel.string=.*/kernel.string=SixFaced/' \
            -e 's/^device.name1=.*/device.name1=curtana/' \
            -e 's/^device.name2=.*/device.name2=joyeuse/' \
            -e 's/^device.name3=.*/device.name3=excalibur/' \
            -e 's/^device.name4=.*/device.name4=gram/' \
            -e 's/^device.name5=.*/device.name5=/' \
            -e 's/^BLOCK=.*/BLOCK=boot;/' \
            -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' \
            -e 's/^RAMDISK_COMPRESSION=.*/RAMDISK_COMPRESSION=auto;/' \
            -e 's/^PATCH_VBMETA_FLAG=.*/PATCH_VBMETA_FLAG=auto;/' \
            "$RUNNER_TEMP/anykernel.sh"
          printf '\nsplit_boot;\nflash_boot;\n' >> "$RUNNER_TEMP/anykernel.sh"
          bash -n "$RUNNER_TEMP/anykernel.sh"
          mv "$RUNNER_TEMP/anykernel.sh" anykernel/anykernel.sh

          # Copy kernel Image.gz only
          cp out/arch/arm64/boot/Image.gz anykernel/Image.gz
          (cd anykernel && zip -q -r1 "$GITHUB_WORKSPACE/${ZIP_NAME}.zip" .)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
