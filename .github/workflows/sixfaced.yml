name: SixFaced miatoll kernel
on:
  push:
    branches: [KSUN]
  pull_request:
    branches: [KSUN]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sixfaced-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Install host build tools
        run: |
          set -euo pipefail
          packages=(bc bison build-essential ca-certificates ccache curl flex git jq libelf-dev
                    libssl-dev libncurses-dev lz4 python3 zip unzip zstd xz-utils cpio kmod
                    gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu device-tree-compiler)
          missing=()
          for pkg in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends "${missing[@]}"
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch pinned kernel dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 AnyKernel3
          git submodule update --init --recursive KernelSU-Next
          git submodule update --init --depth 1 NoMount
          test "$(git -C NoMount rev-parse HEAD)" = dcd77d03e9912f397a586d7da81694d1628f170e
          test -f fs/nomount/nomount.c
          test -f drivers/kernelsu/Kbuild
          git -C KernelSU-Next describe --tags --always
          bash scripts/prepare-ksun.sh
          # SUSFS integration landed: the KernelSU tree must now expose it.
          test -f KernelSU-Next/kernel/susfs/susfs_glue.c
          grep -q 'KSU_IOCTL_SUSFS_CMD' KernelSU-Next/uapi/supercall.h
          grep -q 'KernelSU - SUSFS' KernelSU-Next/kernel/Kconfig
          grep -q 'susfs/susfs_glue.o' KernelSU-Next/kernel/Kbuild
      - name: Resolve latest Neutron Clang
        id: neutron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(curl -fsS --retry 3 --connect-timeout 15 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest)
          asset=$(jq -ec '[.assets[] | select(.name | test("^neutron-clang-[0-9]+[.]tar[.]zst$"))] | select(length == 1) | first' <<< "$release")
          url=$(jq -er '.browser_download_url' <<< "$asset")
          sha=$(jq -er '.digest | capture("^sha256:(?<hex>[0-9a-f]{64})$").hex' <<< "$asset")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "digest=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore Neutron toolchain
        id: neutron-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/neutron
          key: neutron-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.neutron.outputs.digest }}
      - name: Install Neutron Clang if not cached
        if: steps.neutron-cache.outputs.cache-hit != 'true'
        env:
          NEUTRON_URL: ${{ steps.neutron.outputs.url }}
          NEUTRON_SHA: ${{ steps.neutron.outputs.digest }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fL --retry 3 --connect-timeout 15 "$NEUTRON_URL" -o "$tmp/neutron.tar.zst"
          echo "$NEUTRON_SHA  $tmp/neutron.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/neutron"
          tar --zstd -xf "$tmp/neutron.tar.zst" -C "$RUNNER_TEMP/neutron"
      - name: Activate Neutron Clang
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/neutron/bin/clang" --version
          echo "$RUNNER_TEMP/neutron/bin" >> "$GITHUB_PATH"
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-miatoll-${{ steps.neutron.outputs.digest }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-miatoll-${{ steps.neutron.outputs.digest }}-
      - name: Build arm64 Image
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          ccache --zero-stats
          args=(ARCH=arm64 O=out "CC=ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm
                OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
                READELF=llvm-readelf "KCFLAGS=-mtune=cortex-a76 -DKSU_SEPOL_HAS_NATIVE_ARRAYS" LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-)
          make "${args[@]}" vendor/xiaomi/miatoll_defconfig
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_KEYS=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx 'CONFIG_THREAD_INFO_IN_TASK=y' out/.config
          grep -qx 'CONFIG_LRU_GEN=y' out/.config
          grep -qx '# CONFIG_LRU_GEN_ENABLED is not set' out/.config
          make -j"$(nproc)" "${args[@]}" Image
          ccache --show-stats
          llvm-nm out/vmlinux > out/vmlinux.symbols
          grep -E " [tT] kernelsu_init$" out/vmlinux.symbols
          grep -E " [tT] ksu_handle_sys_reboot$" out/vmlinux.symbols
          grep -E " [tT] nomount_init$" out/vmlinux.symbols
          grep -E " [tT] susfs_init$" out/vmlinux.symbols
          grep -E " [tT] susfs_is_inode_sus_path$" out/vmlinux.symbols
          grep -E " [tT] ksu_susfs_handle_ioctl$" out/vmlinux.symbols
          scripts/package-sixfaced.sh out/arch/arm64/boot/Image SixFaced.zip
          unzip -tq SixFaced.zip
      - uses: actions/upload-artifact@v5
        with:
          name: SixFaced-miatoll-${{ github.run_number }}
          path: SixFaced.zip
          if-no-files-found: error
